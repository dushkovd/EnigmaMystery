<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Premium murder mystery games for unforgettable parties and events" />
    <meta name="theme-color" content="#1a1a1a" />
    <!-- Only preload the critical hero image -->
    <link rel="preload" as="image" href="/hero-background.webp" type="image/webp" fetchpriority="high">
    <style>
      /* Ultra-minimal critical CSS for instant FCP */
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; font-size: 16px; }
      body { 
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #1f2937;
        background: #f9fafb;
        margin: 0;
        padding: 0;
        line-height: 1.5;
      }
      #root { min-height: 100vh; }
      
      /* Hero section - most critical for LCP */
      .hero {
        position: relative;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1f2937 0%, #374151 100%);
        color: white;
        text-align: center;
        overflow: hidden;
      }
      .hero-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
        filter: brightness(0.7);
      }
      .hero-content {
        position: relative;
        z-index: 2;
        max-width: 800px;
        padding: 2rem;
      }
      .hero-title {
        font-size: clamp(2.5rem, 8vw, 4rem);
        font-weight: 700;
        margin: 0 0 1.5rem 0;
        line-height: 1.1;
      }
      .hero-subtitle {
        font-size: clamp(1.125rem, 4vw, 1.5rem);
        margin: 0 0 2rem 0;
        opacity: 0.9;
      }
      .btn {
        display: inline-block;
        padding: 0.875rem 2rem;
        background: #dc2626;
        color: white;
        text-decoration: none;
        border-radius: 0.5rem;
        font-weight: 600;
        font-size: 1.125rem;
        margin: 0.5rem;
        transition: background 0.2s;
        border: none;
        cursor: pointer;
      }
      .btn:hover { background: #b91c1c; }
      .btn-outline {
        background: transparent;
        border: 2px solid white;
        color: white;
      }
      .btn-outline:hover {
        background: white;
        color: #1f2937;
      }
      
      /* Loading state */
      .loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #f9fafb;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-size: 1.25rem;
        color: #6b7280;
      }
      
      /* About section critical styles */
      .about-section {
        padding: 4rem 0;
        background: white;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 1rem;
      }
      .section-title {
        font-size: 2.5rem;
        font-weight: 700;
        text-align: center;
        margin: 0 0 3rem 0;
        color: #1f2937;
      }
      .features-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 2rem;
        margin-top: 2rem;
      }
      .feature-card {
        text-align: center;
        padding: 2rem 1rem;
        border-radius: 0.5rem;
        background: #f9fafb;
        border: 1px solid #e5e7eb;
      }
      .feature-icon {
        font-size: 3rem;
        margin-bottom: 1rem;
      }
      .feature-card h3 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 0.5rem 0;
        color: #1f2937;
      }
      .feature-card p {
        color: #6b7280;
        margin: 0;
        line-height: 1.5;
      }
      
      /* Hide loading when React loads */
      .loaded .loading { display: none; }
    </style>
    <title>Murder Mystery Games</title>
    <!-- Analytics moved to progressive loading -->
  </head>
  <body>
    <!-- Facebook Pixel Noscript -->
    <noscript>
      <img height="1" width="1" 
      src="https://www.facebook.com/tr?id=1287939146186577&ev=PageView&noscript=1"/>
    </noscript>
    <!-- End Facebook Pixel Noscript -->
    
    <div id="root"></div>
    
    <script type="module" src="/src/main.tsx" defer></script>
    <script>
      // Progressive loading strategy
      (function() {
        let loaded = false;
        
        // Remove loading state when React loads
        function removeLoading() {
          if (!loaded) {
            document.body.classList.add('loaded');
            loaded = true;
          }
        }
        
        // Load non-critical resources progressively
        function loadNonCriticalResources() {
          // 1. Load fonts first (after 500ms)
          setTimeout(() => {
            const fontLink = document.createElement('link');
            fontLink.rel = 'stylesheet';
            fontLink.href = 'https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lora:wght@400;500;600&display=swap';
            document.head.appendChild(fontLink);
          }, 500);
          
          // 2. Load full CSS (after 1s)
          setTimeout(() => {
            const cssLink = document.createElement('link');
            cssLink.rel = 'stylesheet';
            cssLink.href = '/src/index.css';
            document.head.appendChild(cssLink);
          }, 1000);
          
          // 3. Load analytics immediately (critical for tracking)
          // Load Clarity using the official Microsoft format
          (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
          })(window, document, "clarity", "script", "smi0wej6y2");
          
          // Initialize Clarity after a short delay
          setTimeout(() => {
            if (window.clarity) {
              window.clarity('identify', 'website_visitor');
            }
          }, 1000);
          
          // Load Facebook Pixel after Clarity
          const fbScript = document.createElement('script');
          fbScript.innerHTML = `
            !function(f,b,e,v,n,t,s)
            {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
            n.callMethod.apply(n,arguments):n.queue.push(arguments)};
            if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
            n.queue=[];t=b.createElement(e);t.async=!0;
            t.src=v;s=b.getElementsByTagName(e)[0];
            s.parentNode.insertBefore(t,s)}(window,document,'script',
            'https://connect.facebook.net/en_US/fbevents.js');
            fbq('init', '1287939146186577');
            fbq('track', 'PageView');
          `;
          document.head.appendChild(fbScript);
          
          // 4. Preconnect to Supabase (after 3s)
          setTimeout(() => {
            const supabaseLink = document.createElement('link');
            supabaseLink.rel = 'preconnect';
            supabaseLink.href = 'https://gkuwrqpxwehfnmlsqsxa.supabase.co';
            document.head.appendChild(supabaseLink);
          }, 3000);
        }
        
        // Start progressive loading immediately
        loadNonCriticalResources();
        
        // Remove loading when React loads
        window.addEventListener('load', removeLoading);
        
        // Fallback: remove loading after 5 seconds
        setTimeout(removeLoading, 5000);
      })();
    </script>
  </body>
</html>
