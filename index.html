<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Premium murder mystery games for unforgettable parties and events" />
    <meta name="theme-color" content="#1a1a1a" />
    <!-- Only critical preloads for instant render -->
    <link rel="preload" as="image" href="/hero-background.webp" type="image/webp" fetchpriority="high">
    <style>
      /* Ultra-minimal critical CSS for instant FCP */
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; font-size: 16px; }
      body { 
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #1f2937;
        background: #f9fafb;
        margin: 0;
        padding: 0;
        line-height: 1.5;
      }
      #root { min-height: 100vh; }
      
      /* Hero section - most critical for LCP */
      .hero {
        position: relative;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1f2937 0%, #374151 100%);
        color: white;
        text-align: center;
        overflow: hidden;
      }
      .hero-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
        filter: brightness(0.7);
      }
      .hero-content {
        position: relative;
        z-index: 2;
        max-width: 800px;
        padding: 2rem;
      }
      .hero-title {
        font-size: clamp(2.5rem, 8vw, 4rem);
        font-weight: 700;
        margin: 0 0 1.5rem 0;
        line-height: 1.1;
      }
      .hero-subtitle {
        font-size: clamp(1.125rem, 4vw, 1.5rem);
        margin: 0 0 2rem 0;
        opacity: 0.9;
      }
      .btn {
        display: inline-block;
        padding: 0.875rem 2rem;
        background: #dc2626;
        color: white;
        text-decoration: none;
        border-radius: 0.5rem;
        font-weight: 600;
        font-size: 1.125rem;
        margin: 0.5rem;
        transition: background 0.2s;
        border: none;
        cursor: pointer;
      }
      .btn:hover { background: #b91c1c; }
      .btn-outline {
        background: transparent;
        border: 2px solid white;
        color: white;
      }
      .btn-outline:hover {
        background: white;
        color: #1f2937;
      }
      
      /* Loading state */
      .loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #f9fafb;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-size: 1.25rem;
        color: #6b7280;
      }
      
      /* Hide loading when React loads */
      .loaded .loading { display: none; }
    </style>
    <title>Murder Mystery Games</title>
  </head>
  <body>
    
    <!-- Pure HTML content - no JavaScript blocking -->
    <div class="hero">
      <img src="/hero-background.webp" alt="Hero background" class="hero-bg" loading="eager" fetchpriority="high">
      <div class="hero-content">
        <h1 class="hero-title">Host the Perfect Murder Mystery Night</h1>
        <p class="hero-subtitle">Immersive digital murder mystery games for unforgettable parties</p>
        <div>
          <a href="/shop" class="btn">Explore Games</a>
          <a href="/how-it-works" class="btn btn-outline">How It Works</a>
        </div>
      </div>
    </div>
    
    <!-- React app container - hidden until hydrated -->
    <div id="root" style="display: none;"></div>
    
    <!-- Load everything after initial paint -->
    <script>
      // Load React and analytics after initial paint
      window.addEventListener('load', function() {
        // Load React app
        const script = document.createElement('script');
        script.type = 'module';
        script.src = '/src/main.tsx';
        document.head.appendChild(script);
        
        // Show React app when ready
        script.onload = function() {
          document.getElementById('root').style.display = 'block';
          document.querySelector('.hero').style.display = 'none';
        };
        
        // Load analytics after initial render
        setTimeout(() => {
          // Load Clarity
          const clarityScript = document.createElement('script');
          clarityScript.src = 'https://www.clarity.ms/tag/smi0wej6y2';
          clarityScript.async = true;
          document.head.appendChild(clarityScript);
          
          // Load Facebook Pixel
          const fbScript = document.createElement('script');
          fbScript.innerHTML = `
            !function(f,b,e,v,n,t,s)
            {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
            n.callMethod.apply(n,arguments):n.queue.push(arguments)};
            if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
            n.queue=[];t=b.createElement(e);t.async=!0;
            t.src=v;s=b.getElementsByTagName(e)[0];
            s.parentNode.insertBefore(t,s)}(window,document,'script',
            'https://connect.facebook.net/en_US/fbevents.js');
            fbq('init', '1287939146186577');
            fbq('track', 'PageView');
          `;
          document.head.appendChild(fbScript);
        }, 1000);
      });
    </script>
  </body>
</html>
