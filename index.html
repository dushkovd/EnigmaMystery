    <style>
      /* Critical CSS for FCP */
      html { scroll-behavior: smooth; }
      body { 
        font-family: 'Lora', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #1f2937;
        background-color: #f9fafb;
        margin: 0;
        padding: 0;
      }
      h1, h2, h3, h4, h5, h6 { 
        font-family: 'Playfair Display', serif;
        font-weight: 700;
        color: #1f2937;
        margin: 0;
      }
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-size: 1.125rem;
        color: #6b7280;
      }
      .container-custom {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 1rem;
      }
      @media (min-width: 640px) {
        .container-custom { padding: 0 1.5rem; }
      }
      @media (min-width: 1024px) {
        .container-custom { padding: 0 2rem; }
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.75rem 1.5rem;
        border-radius: 0.375rem;
        font-weight: 500;
        transition: all 0.2s;
        border: none;
        cursor: pointer;
        text-decoration: none;
      }
      .btn-primary {
        background-color: #dc2626;
        color: white;
      }
      .btn-primary:hover {
        background-color: #b91c1c;
      }
      .card {
        background: white;
        border-radius: 0.5rem;
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        overflow: hidden;
        border: 1px solid #f3f4f6;
      }
      /* Hero section critical styles */
      .hero-section {
        position: relative;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .hero-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
      }
      .hero-bg img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: brightness(1.5);
      }
      .hero-content {
        position: relative;
        z-index: 10;
        text-align: center;
        color: white;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 1rem;
      }
      .hero-title {
        font-size: 3rem;
        font-weight: 700;
        margin-bottom: 1rem;
        line-height: 1.1;
      }
      @media (min-width: 768px) {
        .hero-title { font-size: 4rem; }
      }
      @media (min-width: 1024px) {
        .hero-title { font-size: 5rem; }
      }
      /* Additional critical styles for faster FCP */
      .min-h-screen { min-height: 100vh; }
      .flex { display: flex; }
      .items-center { align-items: center; }
      .justify-center { justify-content: center; }
      .text-center { text-align: center; }
      .text-white { color: white; }
      .font-bold { font-weight: 700; }
      .text-4xl { font-size: 2.25rem; line-height: 2.5rem; }
      .mb-4 { margin-bottom: 1rem; }
      .mb-6 { margin-bottom: 1.5rem; }
      .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
      .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
      .rounded-lg { border-radius: 0.5rem; }
      .bg-primary-600 { background-color: #dc2626; }
      .hover\:bg-primary-700:hover { background-color: #b91c1c; }
      .transition-colors { transition-property: color, background-color, border-color, text-decoration-color, fill, stroke; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
      .cursor-pointer { cursor: pointer; }
      .no-underline { text-decoration: none; }
      .inline-block { display: inline-block; }
      .relative { position: relative; }
      .absolute { position: absolute; }
      .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
      .z-10 { z-index: 10; }
      .z-0 { z-index: 0; }
      .overflow-hidden { overflow: hidden; }
      .w-full { width: 100%; }
      .h-full { height: 100%; }
      .object-cover { object-fit: cover; }
      .bg-gradient-to-b { background-image: linear-gradient(to bottom, var(--tw-gradient-stops)); }
      .from-secondary-900\/40 { --tw-gradient-from: rgba(17, 24, 39, 0.4); --tw-gradient-to: rgba(17, 24, 39, 0); --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to); }
      .to-secondary-800\/60 { --tw-gradient-to: rgba(31, 41, 55, 0.6); }
      .mix-blend-multiply { mix-blend-mode: multiply; }
    </style>
