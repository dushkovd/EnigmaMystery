    <style>
      /* Ultra-minimal critical CSS for instant FCP */
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; font-size: 16px; }
      body { 
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #1f2937;
        background: #f9fafb;
        margin: 0;
        padding: 0;
        line-height: 1.5;
      }
      #root { min-height: 100vh; }
      
      /* Hero section - most critical for LCP */
      .hero {
        position: relative;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1f2937 0%, #374151 100%);
        color: white;
        text-align: center;
        overflow: hidden;
      }
      .hero-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
        filter: brightness(0.7);
      }
      .hero-content {
        position: relative;
        z-index: 2;
        max-width: 800px;
        padding: 2rem;
      }
      .hero-title {
        font-size: clamp(2.5rem, 8vw, 4rem);
        font-weight: 700;
        margin: 0 0 1.5rem 0;
        line-height: 1.1;
      }
      .hero-subtitle {
        font-size: clamp(1.125rem, 4vw, 1.5rem);
        margin: 0 0 2rem 0;
        opacity: 0.9;
      }
      .btn {
        display: inline-block;
        padding: 0.875rem 2rem;
        background: #dc2626;
        color: white;
        text-decoration: none;
        border-radius: 0.5rem;
        font-weight: 600;
        font-size: 1.125rem;
        margin: 0.5rem;
        transition: background 0.2s;
        border: none;
        cursor: pointer;
      }
      .btn:hover { background: #b91c1c; }
      .btn-outline {
        background: transparent;
        border: 2px solid white;
        color: white;
      }
      .btn-outline:hover {
        background: white;
        color: #1f2937;
      }
      
      /* Loading state */
      .loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #f9fafb;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-size: 1.25rem;
        color: #6b7280;
      }
      
      /* Hide loading when React loads */
      .loaded .loading { display: none; }
    </style>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lora:wght@400;500;600&display=swap">
